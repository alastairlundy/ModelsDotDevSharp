name: Test and Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly live check - the default job excludes Explicit live tests, so this
    # schedule is the calendar trigger that keeps live drift detection running.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet build src/ModelsDotDevSharp.slnx

      # Default run covers the offline tests only: LivePayloadTests carries
      # [Explicit], so TUnit excludes it unless the filter selects only
      # explicit tests (see the live-test job below).
      - name: Test
        run: dotnet test --solution src/ModelsDotDevSharp.slnx

  live-test:
    # Scheduled or opt-in only: real HTTP against models.dev, never on PR/push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet build src/ModelsDotDevSharp.slnx

      - name: Test live endpoints
        run: dotnet test --solution src/ModelsDotDevSharp.slnx --treenode-filter "/*/*/*/*[Category=Live]"
