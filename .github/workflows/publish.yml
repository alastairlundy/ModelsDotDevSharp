name: Publish Packages to Nuget

on:
  workflow_dispatch
  
jobs:
  build-and-publish:
      runs-on: ubuntu-latest
  
      permissions:
        contents: read
        id-token: write
      environment: production
      
      steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 10.0.x

        - name: Build
          run: dotnet build src/ModelsDotDevSharp/ModelsDotDevSharp.csproj -c Release

        # Get a short-lived NuGet API key
        - name: NuGet login (OIDC → temp API key)
          uses: NuGet/login@v1
          id: login
          with:
            user: ${{ secrets.NUGET_USER }}
      
        # Push the package
        - name: NuGet push
          run: dotnet nuget push src/ModelsDotDevSharp/bin/Release/ModelsDotDevSharp.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
